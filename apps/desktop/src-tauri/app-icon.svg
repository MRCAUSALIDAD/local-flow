<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f7bf5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- rounded-square backdrop -->
  <rect x="72" y="72" width="880" height="880" rx="216" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="216" fill="url(#sheen)"/>

  <!-- abstract waveform mark: symmetric bars forming a sound wave -->
  <g>
    <!-- soft glow underlay -->
    <g fill="#ffffff" opacity="0.35" filter="url(#glow)">
      <rect x="204" y="442" width="56" height="140" rx="28"/>
      <rect x="332" y="382" width="56" height="260" rx="28"/>
      <rect x="460" y="312" width="56" height="400" rx="28"/>
      <rect x="588" y="252" width="56" height="520" rx="28"/>
      <rect x="716" y="382" width="56" height="260" rx="28"/>
      <rect x="796" y="442" width="56" height="140" rx="28"/>
    </g>
    <!-- crisp bars -->
    <g fill="#ffffff">
      <rect x="204" y="442" width="56" height="140" rx="28"/>
      <rect x="332" y="382" width="56" height="260" rx="28"/>
      <rect x="460" y="312" width="56" height="400" rx="28"/>
      <rect x="588" y="252" width="56" height="520" rx="28"/>
      <rect x="716" y="382" width="56" height="260" rx="28"/>
      <rect x="796" y="442" width="56" height="140" rx="28"/>
    </g>
  </g>
</svg>
