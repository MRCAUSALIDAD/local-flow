name: CI

# Compiles and tests on all three desktop platforms. The release workflow only
# runs on tags, so without this a change could reach a tag having never been
# built anywhere but the author's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - name: Type-check
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/desktop
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Tauri/WebKit plus this app's native dependencies. libasound2-dev is the
      # microphone (cpal), libxdo-dev is keystroke injection (enigo), and
      # cmake builds whisper.cpp from source.
      # GitHub's Azure apt mirrors intermittently stop responding and apt
      # retries them until the job times out. Point at the canonical archive
      # and cap the retries so a bad mirror fails fast instead of hanging.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # sources.list points at mirror+file:/etc/apt/apt-mirrors.txt, so the
          # Azure mirrors live in that file and editing sources.list leaves them
          # in place. Replace the list with the canonical archive instead.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            build-essential cmake curl wget file patchelf \
            libasound2-dev libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # tauri::generate_context! reads the frontend build output, so the
      # Rust crate does not compile without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci && npm run build

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
        continue-on-error: true

      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib
